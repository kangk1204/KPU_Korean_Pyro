name: Reproduce aggregate analyses
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  numerical-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify release file integrity
        run: python verify_repository.py
      - name: Regenerate and compare numerical outputs
        run: python reproduce.py --output reproduced
      - name: Run statistical regression suites
        run: python run_tests.py
      - name: Preserve both meta-analysis diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meta-analysis-diagnostics
          path: reproduced/meta_analysis/diagnostics.json
          if-no-files-found: ignore
